<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Contact &mdash; Nathaniel Lubin</title>
<meta name="description" content="Get in touch with Nathaniel Lubin.">
<link rel="stylesheet" href="../css/style.css">
</head>
<body>

<header class="site-header">
  <div class="site-header__inner">
    <a class="site-title" href="../">Nathaniel Lubin</a>
    <nav aria-label="Primary">
      <ul class="site-nav">
        <li><a href="../work/">Work</a></li>
        <li><a href="../research/">Research &amp; Projects</a></li>
        <li><a href="../writing/">Writing</a></li>
        <li><a href="../press/">Press</a></li>
        <li><a href="./" aria-current="page">Contact</a></li>
      </ul>
    </nav>
  </div>
</header>

<main>
  <div class="wrap wrap--wide">

    <div class="page-header contact-intro">
      <h1>Contact</h1>
      <p>Thanks for reading about my work. If you&rsquo;re interested in collaborating or learning more about specifics, send me a note.</p>
    </div>

    <form class="contact-form" action="https://formspree.io/f/mdengjod" method="POST">
      <input class="form-hp" type="text" name="_gotcha" tabindex="-1" autocomplete="off">

      <div class="form-row form-row--split">
        <div class="form-row">
          <label for="first-name">First name</label>
          <input type="text" id="first-name" name="First name" required>
        </div>
        <div class="form-row">
          <label for="last-name">Last name</label>
          <input type="text" id="last-name" name="Last name" required>
        </div>
      </div>

      <div class="form-row">
        <label for="email">Email</label>
        <input type="email" id="email" name="_replyto" required>
      </div>

      <div class="form-row">
        <label for="subject">Subject</label>
        <input type="text" id="subject" name="Subject" required>
      </div>

      <div class="form-row">
        <label for="message">Message</label>
        <textarea id="message" name="Message" required></textarea>
      </div>

      <button class="form-submit" type="submit">Send</button>
    </form>

  </div>
</main>

<footer class="site-footer">
  <div class="wrap wrap--wide">
    <p>&copy; 2026 Nathaniel Lubin</p>
  </div>
</footer>

</body>
</html>
